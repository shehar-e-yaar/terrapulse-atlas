name: Validate TerraPulse
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python pipeline/etl_to_s3_iceberg.py
      - uses: actions/upload-artifact@v4
        with:
          name: terrapulse-production
          path: dist
